name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-run.txt
      - name: Install the slim runtime set, the MCP SDK and pytest
        run: pip install -r requirements-run.txt "mcp[cli]>=2,<3" pytest
      - name: "Run the tests (no API key and no network needed: ingestion is skipped)"
        run: python -m pytest -q
